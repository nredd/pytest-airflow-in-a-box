name: Cut Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.10.0"
        required: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Bump, tag, and push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor == 'nredd'
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - name: Configure the release bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.2/install.sh | sh
      - name: Sync dependencies
        run: uv sync --locked
      - name: Bump version, build the changelog, tag, and push
        run: uv run python scripts/cut_release.py "${{ inputs.version }}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: gh release create "v${{ inputs.version }}" --title "v${{ inputs.version }}" --generate-notes
