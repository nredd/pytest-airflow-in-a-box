name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `towncrier check` (the `changelog-fragment-required` hook below) diffs
          # against `origin/main`; the default shallow, single-ref checkout never
          # fetches that branch, so towncrier can't resolve it and aborts.
          fetch-depth: 0
          # `.claude/skills/` and `.agents/skills/` symlink into skills/mattpocock/, a
          # submodule; without this the broken-symlink hooks below fail on an empty dir.
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.2/install.sh | sh
      - name: Sync dependencies
        run: uv sync --locked
      - name: Check lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Check repository hooks
        run: uv run prek run --all-files
      - name: Build distributions
        run: uv run python -m build --installer uv
      - name: Smoke-test the bare wheel without Airflow
        # The plugin must load and stay inert from a bare `pip install` with no
        # Airflow present, and `--airflow-doctor` must render the actionable
        # incompatibility instead of crashing. Guards the no-Airflow base-deps
        # contract introduced for the 2.x tier (#25).
        run: |
          uv venv --python "$PYTHON_VERSION" .venv-bare
          uv pip install --python .venv-bare/bin/python dist/*.whl
          mkdir -p /tmp/bare-suite
          printf 'def test_trivial() -> None:\n    assert True\n' > /tmp/bare-suite/test_trivial.py
          (cd /tmp/bare-suite && "$GITHUB_WORKSPACE/.venv-bare/bin/pytest" -q test_trivial.py \
            --airflow-report-dir="$GITHUB_WORKSPACE/reports/bare")
          (cd /tmp/bare-suite && "$GITHUB_WORKSPACE/.venv-bare/bin/pytest" -q --airflow-doctor | grep -F "No Airflow distribution is installed")
      - name: Smoke-test the wheel through the airflow3 extra
        # Every install snippet in the docs names the `airflow3` extra, yet the compat
        # matrix pins `apache-airflow-core` explicitly -- this is the one leg that
        # resolves the extra itself, so specifier drift (a 3.4 release slipping the
        # `<4` bound past `SUPPORTED_RELEASES`, a diverging meta-package pin) fails
        # here instead of on a user (#25).
        run: |
          uv venv --python "$PYTHON_VERSION" .venv-extra
          uv pip install --python .venv-extra/bin/python "$(ls dist/*.whl)[airflow3]"
          mkdir -p /tmp/extra-suite
          printf 'import pytest\n\n\n@pytest.mark.db_test\ndef test_migrates() -> None:\n    assert True\n' > /tmp/extra-suite/test_extra.py
          (cd /tmp/extra-suite && "$GITHUB_WORKSPACE/.venv-extra/bin/pytest" -q test_extra.py \
            --airflow-report-dir="$GITHUB_WORKSPACE/reports/extra")
      - name: Upload wheel smoke reports
        # `always()` because a report from a failing run is the whole point;
        # `if-no-files-found: warn` because a run that died before configuration
        # leaves nothing behind, and a second red X would bury the real failure.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-wheel-smoke
          path: reports
          retention-days: 7
          if-no-files-found: warn
      - name: Sync docs dependencies
        run: uv sync --locked --group docs
      - name: Build docs
        run: uv run mkdocs build --strict

  compat:
    name: Compat
    uses: ./.github/workflows/compat.yml

  action-smoke:
    name: >-
      Action smoke / Airflow ${{ matrix.airflow-version }} / Python ${{ matrix.python-version }}
      (${{ matrix.extra }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - airflow-version: "3.3.0"
            python-version: "3.12"
            extra: airflow3
          - airflow-version: "2.11.2"
            python-version: "3.12"
            extra: airflow2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Provision the environment via the local action
        # Installs the PUBLISHED PyPI package (latest, `plugin-version` left
        # unset), not this branch's own code -- this job proves the action's
        # wrapper mechanics work, not the current branch's plugin internals;
        # `compat` above already covers that via editable installs.
        id: env
        uses: ./action
        with:
          airflow-version: ${{ matrix.airflow-version }}
          python-version: ${{ matrix.python-version }}
          extra: ${{ matrix.extra }}
          working-directory: action/smoke-test
          report-dir: ${{ github.workspace }}/reports
      - name: Run the smoke fixture through the provisioned interpreter
        # No `--airflow-report-dir` here on purpose: the action's `report-dir`
        # input already appended it to `PYTEST_ADDOPTS`, which is exactly the
        # consumer path this job exists to prove. Until the release carrying the
        # option is on PyPI, the action's own version probe skips the append and
        # this job uploads nothing -- see the action's `report-dir` handling.
        working-directory: action/smoke-test
        run: ${{ steps.env.outputs.python-path }} -m pytest -v
      - name: Upload action smoke reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-action-smoke-${{ matrix.airflow-version }}-${{ matrix.extra }}
          # Literal, not `steps.env.outputs.report-dir`: on a provisioning failure
          # that output is empty and `upload-artifact` fails on a missing `path`,
          # burying the real error under an input error.
          path: ${{ github.workspace }}/reports
          retention-days: 7
          if-no-files-found: warn

  postgres:
    name: postgres / Airflow 3.3.0 / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.2/install.sh | sh
      - name: Create constrained environment
        env:
          AIRFLOW_VERSION: "3.3.0"
          PYTHON_VERSION: "3.12"
        run: |
          uv venv --python "$PYTHON_VERSION" .venv-ci
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            "https://github.com/apache/airflow/raw/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt" \
            --output airflow-constraints.txt
          uv pip install --python .venv-ci/bin/python \
            --constraint airflow-constraints.txt \
            --editable ".[postgres,xdist]" \
            "apache-airflow-core==${AIRFLOW_VERSION}" \
            "apache-airflow-providers-sqlite>=4.1,<5"
          uv pip install --python .venv-ci/bin/python coverage
          .venv-ci/bin/python scripts/install_coverage_pth.py
      - name: Run tests
        # This leg buys real-integration confidence (FK-enforced `clear_db`
        # order, `dag_maker`/`run_ti`/`api_test` parity on a real server), not
        # coverage necessity: the injected-seam unit tests hold the 100 floor
        # on every leg with no Docker. `ubuntu-latest` ships Docker, so the real
        # testcontainers provisioner runs end-to-end. The outer flag governs
        # only this session's metadata database; the `runpytest_subprocess`
        # self-tests bootstrap their own inner sessions.
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: >-
          .venv-ci/bin/python -m coverage run -m pytest -v
          --airflow-db-backend=postgres
          --airflow-report-dir="${{ github.workspace }}/reports"
          -m "compat or db_test or postgres"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-postgres-3.3.0-3.12
          path: reports
          retention-days: 7
          if-no-files-found: warn
      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-postgres-3.3.0-3.12
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [compat, postgres]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.2/install.sh | sh
      - name: Sync dependencies
        run: uv sync --locked
      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine and report
        # Every 3.x leg runs the full suite with fake-libc/windll probes; the three
        # `airflow2` legs run only `tests/enduser` (the consumer contract -- labeled
        # `consumer contract only` in the checks list and `-enduser` in artifact
        # names), so the 100% bar holds as the UNION across legs, with the 2.x-only
        # src/ branches reached live by the 2.x legs and by fake probes elsewhere.
        run: |
          set -euo pipefail
          uv run coverage combine
          uv run coverage xml
          uv run coverage report --fail-under=100 | tee coverage-report.txt
      - name: Upload combined report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-combined
          path: coverage.xml
          if-no-files-found: error
      - name: Generate detailed coverage report
        # The gating report above uses pyproject.toml's `skip_covered = true`, so a
        # green (100%) build collapses every file to the `TOTAL` row. This report
        # overrides that for display purposes only -- one row per module.
        run: uv run coverage report --no-skip-covered --format=markdown --precision=2 | tee coverage-report.md
      - name: Write coverage summary
        run: |
          {
            echo '## Coverage'
            cat coverage-report.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          total=$(uv run coverage report --format=total)
          if [ "$total" -ge 95 ]; then color=brightgreen
          elif [ "$total" -ge 90 ]; then color=green
          elif [ "$total" -ge 80 ]; then color=yellowgreen
          else color=orange
          fi
          printf '{"schemaVersion": 1, "label": "coverage", "message": "%s%%", "color": "%s"}\n' \
            "$total" "$color" > coverage-badge.json
          blob=$(git hash-object -w coverage-badge.json)
          tree=$(printf '100644 blob %s\tcoverage.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Update coverage badge to ${total}%")
          git push --force origin "$commit:refs/heads/badges"
      - name: Comment combined report on the pull request
        if: github.event_name == 'pull_request'
        # Dependabot-triggered runs carry a read-only token; skip, don't fail.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- pytest-airflow-in-a-box-coverage-report -->'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "$marker"
            echo 'Combined coverage across every CI leg:'
            echo '```text'
            cat coverage-report.txt
            echo '```'
            echo "Full build summary: ${run_url}"
            echo
            echo '<details>'
            echo '<summary>Per-module coverage</summary>'
            echo
            cat coverage-report.md
            echo
            echo '</details>'
          } > coverage-comment.md
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("pytest-airflow-in-a-box-coverage-report")) | .id' \
            | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F body=@coverage-comment.md
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@coverage-comment.md
          fi
