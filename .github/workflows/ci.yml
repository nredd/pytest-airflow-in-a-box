name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.2/install.sh | sh
      - name: Sync dependencies
        run: uv sync --locked
      - name: Check lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Check repository hooks
        run: uv run prek run --all-files
      - name: Build distributions
        run: uv run python -m build --installer uv

  test:
    name: >-
      ${{ matrix.os || 'ubuntu-latest' }} /
      Airflow ${{ matrix.airflow-version }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - airflow-version: "3.1.0"
            python-version: "3.10"
          - airflow-version: "3.1.8"
            python-version: "3.11"
          - airflow-version: "3.1.8"
            python-version: "3.12"
          - airflow-version: "3.2.0"
            python-version: "3.13"
          - airflow-version: "3.2.2"
            python-version: "3.12"
          - airflow-version: "3.3.0"
            python-version: "3.12"
          - airflow-version: "3.3.0"
            python-version: "3.14"
          - airflow-version: "3.3.0"
            python-version: "3.12"
            os: macos-latest
          - airflow-version: "3.3.0"
            python-version: "3.12"
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.2/install.sh | sh
      - name: Create constrained environment
        env:
          AIRFLOW_VERSION: ${{ matrix.airflow-version }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv --python "$PYTHON_VERSION" .venv-ci
          curl --fail --location --silent --show-error \
            "https://github.com/apache/airflow/raw/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt" \
            --output airflow-constraints.txt
          uv pip install --python .venv-ci/bin/python \
            --constraint airflow-constraints.txt \
            --editable . \
            "apache-airflow-core==${AIRFLOW_VERSION}"
          uv pip install --python .venv-ci/bin/python coverage
          .venv-ci/bin/python scripts/install_coverage_pth.py
      - name: Run tests
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: .venv-ci/bin/python -m coverage run -m pytest -v
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os || 'ubuntu-latest' }}-${{ matrix.airflow-version }}-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  musl:
    name: alpine-musl / Airflow 3.3.0 / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: python:3.12-alpine
    steps:
      - uses: actions/checkout@v7
      - name: Install build prerequisites
        run: apk add --no-cache build-base curl git libffi-dev
      - name: Install uv
        run: python -m pip install uv==0.12.2
      - name: Create constrained environment
        env:
          AIRFLOW_VERSION: "3.3.0"
          PYTHON_VERSION: "3.12"
        run: |
          uv venv --python "$(command -v python)" .venv-ci
          curl --fail --location --silent --show-error \
            "https://github.com/apache/airflow/raw/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt" \
            --output airflow-constraints.txt
          uv pip install --python .venv-ci/bin/python \
            --constraint airflow-constraints.txt \
            --editable . \
            "apache-airflow-core==${AIRFLOW_VERSION}"
          uv pip install --python .venv-ci/bin/python coverage
          .venv-ci/bin/python scripts/install_coverage_pth.py
      - name: Run tests
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: .venv-ci/bin/python -m coverage run -m pytest -v
      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-alpine-musl-3.3.0-3.12
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, musl]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.2/install.sh | sh
      - name: Sync dependencies
        run: uv sync --locked
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine and report
        # Every leg runs the full suite with fake-libc/windll probes, so the
        # union carries the same 100 bar as the local gate.
        run: |
          set -euo pipefail
          uv run coverage combine
          uv run coverage xml
          uv run coverage report --fail-under=100 | tee coverage-report.txt
      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: coverage.xml
          if-no-files-found: error
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          total=$(uv run coverage report --format=total)
          if [ "$total" -ge 95 ]; then color=brightgreen
          elif [ "$total" -ge 90 ]; then color=green
          elif [ "$total" -ge 80 ]; then color=yellowgreen
          else color=orange
          fi
          printf '{"schemaVersion": 1, "label": "coverage", "message": "%s%%", "color": "%s"}\n' \
            "$total" "$color" > coverage-badge.json
          # The repo is private, so shields.io cannot read the endpoint JSON;
          # render the SVG ourselves and let GitHub serve it with viewer auth.
          # The JSON stays published for shields if the repo ever goes public.
          case "$color" in
            brightgreen) hex="#4c1" ;;
            green) hex="#97ca00" ;;
            yellowgreen) hex="#a4a61d" ;;
            *) hex="#fe7d37" ;;
          esac
          message="${total}%"
          label_width=61
          message_width=$(( ${#message} * 7 + 14 ))
          total_width=$(( label_width + message_width ))
          message_center=$(( (label_width * 10) + (message_width * 5) ))
          message_length=$(( (message_width - 10) * 10 ))
          {
            printf '<svg xmlns="http://www.w3.org/2000/svg" width="%s" height="20" role="img" aria-label="coverage: %s">\n' "$total_width" "$message"
            printf '<linearGradient id="s" x2="0" y2="100%%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>\n'
            printf '<clipPath id="r"><rect width="%s" height="20" rx="3" fill="#fff"/></clipPath>\n' "$total_width"
            printf '<g clip-path="url(#r)"><rect width="%s" height="20" fill="#555"/>' "$label_width"
            printf '<rect x="%s" width="%s" height="20" fill="%s"/>' "$label_width" "$message_width" "$hex"
            printf '<rect width="%s" height="20" fill="url(#s)"/></g>\n' "$total_width"
            printf '<g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-rendering="geometricPrecision">\n'
            printf '<text x="315" y="140" transform="scale(.1)" fill="#010101" fill-opacity=".3" textLength="510">coverage</text>\n'
            printf '<text x="315" y="130" transform="scale(.1)" textLength="510">coverage</text>\n'
            printf '<text x="%s" y="140" transform="scale(.1)" fill="#010101" fill-opacity=".3" textLength="%s">%s</text>\n' "$message_center" "$message_length" "$message"
            printf '<text x="%s" y="130" transform="scale(.1)" textLength="%s">%s</text>\n' "$message_center" "$message_length" "$message"
            printf '</g>\n</svg>\n'
          } > coverage-badge.svg
          json_blob=$(git hash-object -w coverage-badge.json)
          svg_blob=$(git hash-object -w coverage-badge.svg)
          tree=$(printf '100644 blob %s\tcoverage.json\n100644 blob %s\tcoverage.svg\n' \
            "$json_blob" "$svg_blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Update coverage badge to ${total}%")
          git push --force origin "$commit:refs/heads/badges"
      - name: Comment combined report on the pull request
        if: github.event_name == 'pull_request'
        # Dependabot-triggered runs carry a read-only token; skip, don't fail.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- pytest-airflow-in-a-box-coverage-report -->'
          {
            echo "$marker"
            echo 'Combined coverage across every CI leg:'
            echo '```text'
            cat coverage-report.txt
            echo '```'
          } > coverage-comment.md
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("pytest-airflow-in-a-box-coverage-report")) | .id' \
            | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F body=@coverage-comment.md
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@coverage-comment.md
          fi
