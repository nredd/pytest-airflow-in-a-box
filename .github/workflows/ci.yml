name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.2/install.sh | sh
      - name: Sync dependencies
        run: uv sync --locked
      - name: Check lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Check repository hooks
        run: uv run prek run --all-files
      - name: Build distributions
        run: uv run python -m build --installer uv

  test:
    name: >-
      ${{ matrix.os || 'ubuntu-latest' }} /
      Airflow ${{ matrix.airflow-version }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - airflow-version: "3.1.0"
            python-version: "3.10"
          - airflow-version: "3.1.8"
            python-version: "3.11"
          - airflow-version: "3.1.8"
            python-version: "3.12"
          - airflow-version: "3.2.0"
            python-version: "3.13"
          - airflow-version: "3.2.2"
            python-version: "3.12"
          - airflow-version: "3.3.0"
            python-version: "3.12"
          - airflow-version: "3.3.0"
            python-version: "3.14"
          - airflow-version: "3.3.0"
            python-version: "3.12"
            os: macos-latest
          - airflow-version: "3.3.0"
            python-version: "3.12"
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.2/install.sh | sh
      - name: Create constrained environment
        env:
          AIRFLOW_VERSION: ${{ matrix.airflow-version }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv --python "$PYTHON_VERSION" .venv-ci
          curl --fail --location --silent --show-error \
            "https://github.com/apache/airflow/raw/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt" \
            --output airflow-constraints.txt
          uv pip install --python .venv-ci/bin/python \
            --constraint airflow-constraints.txt \
            --editable . \
            "apache-airflow-core==${AIRFLOW_VERSION}"
      - name: Run tests
        run: .venv-ci/bin/python -m pytest -v

  musl:
    name: alpine-musl / Airflow 3.3.0 / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: python:3.12-alpine
    steps:
      - uses: actions/checkout@v5
      - name: Install build prerequisites
        run: apk add --no-cache build-base curl git libffi-dev
      - name: Install uv
        run: python -m pip install uv==0.12.2
      - name: Create constrained environment
        env:
          AIRFLOW_VERSION: "3.3.0"
          PYTHON_VERSION: "3.12"
        run: |
          uv venv --python "$(command -v python)" .venv-ci
          curl --fail --location --silent --show-error \
            "https://github.com/apache/airflow/raw/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt" \
            --output airflow-constraints.txt
          uv pip install --python .venv-ci/bin/python \
            --constraint airflow-constraints.txt \
            --editable . \
            "apache-airflow-core==${AIRFLOW_VERSION}"
      - name: Run tests
        run: .venv-ci/bin/python -m pytest -v
