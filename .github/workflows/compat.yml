name: Compat

on:
  workflow_call:

jobs:
  test:
    name: >-
      ${{ matrix.os || 'ubuntu-latest' }} /
      Airflow ${{ matrix.airflow-version }} / Python ${{ matrix.python-version }}
      ${{ matrix.pytest-args }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - airflow-version: "3.1.0"
            python-version: "3.10"
          - airflow-version: "3.1.1"
            python-version: "3.10"
          - airflow-version: "3.1.2"
            python-version: "3.11"
          - airflow-version: "3.1.3"
            python-version: "3.12"
          - airflow-version: "3.1.5"
            python-version: "3.13"
          - airflow-version: "3.1.6"
            python-version: "3.10"
          - airflow-version: "3.1.7"
            python-version: "3.11"
          - airflow-version: "3.1.8"
            python-version: "3.11"
          - airflow-version: "3.1.8"
            python-version: "3.12"
          - airflow-version: "3.2.0"
            python-version: "3.13"
          - airflow-version: "3.2.1"
            python-version: "3.13"
          - airflow-version: "3.2.2"
            python-version: "3.12"
          - airflow-version: "3.3.0"
            python-version: "3.12"
          # The one leg closing PLAN.md's outer-suite xdist verification: latest
          # Airflow x latest CPython runs the whole outer suite parallel. Pinned
          # to `-n 4` (the runner's vCPU count) for reproducibility; the nested
          # `-n auto` compat scenario covers real per-host core-count variance.
          - airflow-version: "3.3.0"
            python-version: "3.14"
            pytest-args: "-n 4"
          - airflow-version: "3.3.0"
            python-version: "3.12"
            os: macos-latest
          - airflow-version: "3.3.0"
            python-version: "3.12"
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.2/install.sh | sh
      - name: Create constrained environment
        env:
          AIRFLOW_VERSION: ${{ matrix.airflow-version }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv --python "$PYTHON_VERSION" .venv-ci
          curl --fail --location --silent --show-error \
            "https://github.com/apache/airflow/raw/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt" \
            --output airflow-constraints.txt
          uv pip install --python .venv-ci/bin/python \
            --constraint airflow-constraints.txt \
            --editable . \
            "apache-airflow-core==${AIRFLOW_VERSION}"
          uv pip install --python .venv-ci/bin/python coverage
          .venv-ci/bin/python scripts/install_coverage_pth.py
      - name: Run tests
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: .venv-ci/bin/python -m coverage run -m pytest -v ${{ matrix.pytest-args }}
      - name: Upload coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os || 'ubuntu-latest' }}-${{ matrix.airflow-version }}-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  musl:
    name: alpine-musl / Airflow 3.3.0 / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: python:3.12-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build prerequisites
        run: apk add --no-cache build-base curl git libffi-dev
      - name: Install uv
        run: python -m pip install uv==0.12.2
      - name: Create constrained environment
        env:
          AIRFLOW_VERSION: "3.3.0"
          PYTHON_VERSION: "3.12"
        run: |
          uv venv --python "$(command -v python)" .venv-ci
          curl --fail --location --silent --show-error \
            "https://github.com/apache/airflow/raw/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt" \
            --output airflow-constraints.txt
          uv pip install --python .venv-ci/bin/python \
            --constraint airflow-constraints.txt \
            --editable . \
            "apache-airflow-core==${AIRFLOW_VERSION}"
          uv pip install --python .venv-ci/bin/python coverage
          .venv-ci/bin/python scripts/install_coverage_pth.py
      - name: Run tests
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: .venv-ci/bin/python -m coverage run -m pytest -v
      - name: Upload coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-alpine-musl-3.3.0-3.12
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
