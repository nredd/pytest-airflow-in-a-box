name: Compat

on:
  workflow_call:

jobs:
  test:
    name: >-
      ${{ matrix.os || 'ubuntu-latest' }} /
      Airflow ${{ matrix.airflow-version }} / Python ${{ matrix.python-version }}
      ${{ matrix.pytest-args }}${{ matrix.pytest-label }}${{ matrix.pytest-paths && ' / consumer contract only' || '' }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - airflow-version: "3.1.0"
            python-version: "3.10"
          - airflow-version: "3.1.1"
            python-version: "3.10"
          - airflow-version: "3.1.2"
            python-version: "3.11"
          - airflow-version: "3.1.3"
            python-version: "3.12"
          - airflow-version: "3.1.5"
            python-version: "3.13"
          - airflow-version: "3.1.6"
            python-version: "3.10"
          - airflow-version: "3.1.7"
            python-version: "3.11"
          - airflow-version: "3.1.8"
            python-version: "3.11"
          - airflow-version: "3.1.8"
            python-version: "3.12"
          - airflow-version: "3.2.0"
            python-version: "3.13"
          - airflow-version: "3.2.1"
            python-version: "3.13"
          - airflow-version: "3.2.2"
            python-version: "3.12"
          - airflow-version: "3.3.0"
            python-version: "3.12"
          - airflow-version: "3.3.1"
            python-version: "3.13"
          - airflow-version: "3.3.0"
            python-version: "3.12"
            pytest-spec: "pytest==8.0.0"
            pytest-label: "/ pytest 8.0.0"
          - airflow-version: "3.3.0"
            python-version: "3.14"
          # The one leg closing PLAN.md's outer-suite xdist verification: a
          # deliberate duplicate of the latest Airflow x latest CPython leg
          # running the whole outer suite parallel, kept separate so the serial
          # leg's signal stays unburied. Pinned to `-n 4` (the runner's vCPU
          # count) for reproducibility; the nested `-n auto` compat scenario
          # covers real per-host core-count variance.
          - airflow-version: "3.3.0"
            python-version: "3.14"
            pytest-args: "-n 4"
          - airflow-version: "3.3.0"
            python-version: "3.12"
            os: macos-latest
          - airflow-version: "3.3.0"
            python-version: "3.12"
            os: ubuntu-24.04-arm
          # The Airflow 2.x tier (#25): certified releases per #41, on the Python each
          # leg's constraints file targets. 2.x caps Python at 3.12, so the matrix is
          # deliberately ragged. The legs run only `tests/enduser` -- the consumer
          # contract, dual-family since #83 -- because the inner unit suite (`tests/`
          # proper) exercises the plugin's own internals against 3.x-only modules at
          # module scope and does not collect on 2.x; its 2.x branches are covered by
          # fake probes on the 3.x legs, and the coverage job unions all of it.
          - airflow-version: "2.11.2"
            python-version: "3.12"
            airflow-family: "airflow2"
            pytest-paths: "tests/enduser"
          # Same 2.11.2 leg under xdist (#43): gives the `ensure_database` warnings-context
          # fix (unrelated to migration-strict mode, but found while spiking on it) live
          # real-Airflow coverage on top of the mocked regression test in `test_plugin.py`.
          - airflow-version: "2.11.2"
            python-version: "3.12"
            airflow-family: "airflow2"
            pytest-paths: "tests/enduser"
            pytest-args: "-n 2"
          - airflow-version: "2.10.5"
            python-version: "3.11"
            airflow-family: "airflow2"
            pytest-paths: "tests/enduser"
          - airflow-version: "2.9.3"
            python-version: "3.10"
            airflow-family: "airflow2"
            pytest-paths: "tests/enduser"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.2/install.sh | sh
      - name: Create constrained environment
        env:
          AIRFLOW_VERSION: ${{ matrix.airflow-version }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv --python "$PYTHON_VERSION" .venv-ci
          curl --fail --location --silent --show-error \
            "https://github.com/apache/airflow/raw/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt" \
            --output airflow-constraints.txt
          if [ "${{ matrix.airflow-family }}" = "airflow2" ]; then
            # Two-pass install (#41): Airflow under its constraints first, then the
            # plugin without them -- 2.x constraints pin pytest as low as 7.4.4,
            # below the plugin's `pytest>=8` floor. pytest gets an explicit ceiling
            # because no constraints file governs pass two; `pytest>=8,<9` is what
            # certified the tier.
            uv pip install --python .venv-ci/bin/python \
              --constraint airflow-constraints.txt \
              "apache-airflow==${AIRFLOW_VERSION}"
            uv pip install --python .venv-ci/bin/python --editable . "pytest>=8,<9"
          else
            uv pip install --python .venv-ci/bin/python \
              --constraint airflow-constraints.txt \
              --editable . \
              "apache-airflow-core==${AIRFLOW_VERSION}" \
              "apache-airflow-providers-sqlite>=4.1,<5"
          fi
          if [ -n "${{ matrix.pytest-spec }}" ]; then
            uv pip install --python .venv-ci/bin/python "${{ matrix.pytest-spec }}"
          fi
          uv pip install --python .venv-ci/bin/python coverage
          .venv-ci/bin/python scripts/install_coverage_pth.py
      - name: Run tests
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: .venv-ci/bin/python -m coverage run -m pytest -v ${{ matrix.pytest-args }} ${{ matrix.pytest-paths }}
      - name: Upload coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os || 'ubuntu-latest' }}-${{ matrix.airflow-version }}-${{ matrix.python-version }}${{ matrix.pytest-args && '-xdist' || '' }}${{ matrix.pytest-spec && '-pytest8' || '' }}${{ matrix.pytest-paths && '-enduser' || '' }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  musl:
    name: alpine-musl / Airflow 3.3.0 / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: python:3.12-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build prerequisites
        run: apk add --no-cache build-base curl git libffi-dev
      - name: Install uv
        run: python -m pip install uv==0.12.2
      - name: Create constrained environment
        env:
          AIRFLOW_VERSION: "3.3.0"
          PYTHON_VERSION: "3.12"
        run: |
          uv venv --python "$(command -v python)" .venv-ci
          curl --fail --location --silent --show-error \
            "https://github.com/apache/airflow/raw/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt" \
            --output airflow-constraints.txt
          uv pip install --python .venv-ci/bin/python \
            --constraint airflow-constraints.txt \
            --editable . \
            "apache-airflow-core==${AIRFLOW_VERSION}" \
            "apache-airflow-providers-sqlite>=4.1,<5"
          uv pip install --python .venv-ci/bin/python coverage
          .venv-ci/bin/python scripts/install_coverage_pth.py
      - name: Run tests
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: .venv-ci/bin/python -m coverage run -m pytest -v
      - name: Upload coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-alpine-musl-3.3.0-3.12
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
