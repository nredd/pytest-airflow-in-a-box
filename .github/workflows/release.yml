name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.2/install.sh | sh
      - name: Sync dependencies
        run: uv sync --locked
      - name: Verify the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag_version="${TAG#v}"
          pyproject_version="$(uv version --short)"
          init_version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/pytest_airflow_in_a_box/__init__.py)"
          if [ "$tag_version" != "$pyproject_version" ] || [ "$tag_version" != "$init_version" ]; then
            echo "version mismatch: tag=$tag_version pyproject.toml=$pyproject_version __init__.py=$init_version" >&2
            exit 1
          fi
      - name: Verify CI is green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '.workflow_runs[0].conclusion // "missing"')"
          if [ "$conclusion" != "success" ]; then
            echo "CI has no successful completed run for ${GITHUB_SHA} (found: $conclusion); refusing to release" >&2
            exit 1
          fi
      - name: Build distributions
        run: uv run python -m build --installer uv
      - name: Validate distributions
        run: uvx twine@7.0.0 check --strict dist/*
      - name: Assert wheel contents
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          python -m zipfile -l "$wheel" | grep -q 'pytest_airflow_in_a_box/py.typed'
          python -m zipfile -l "$wheel" | grep -q 'entry_points.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/*"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
