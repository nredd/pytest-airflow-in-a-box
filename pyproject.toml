[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[project]
name = "pytest-airflow-in-a-box"
version = "0.1.2"
description = "Pytest infrastructure for testing Apache Airflow DAGs without a live deployment"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["airflow", "dag", "pytest", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Apache Airflow",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "apache-airflow-core>=3.1,<4",
    "apache-airflow-providers-sqlite>=4.1,<5",
    "pytest>=9.1",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29,<1",
    "psycopg2-binary>=2.9,<3",
    "testcontainers>=4.15,<5",
]

[project.urls]
Changelog = "https://github.com/nredd/pytest-airflow-in-a-box/blob/main/CHANGELOG.md"
Documentation = "https://github.com/nredd/pytest-airflow-in-a-box#readme"
Homepage = "https://github.com/nredd/pytest-airflow-in-a-box"
Issues = "https://github.com/nredd/pytest-airflow-in-a-box/issues"
Repository = "https://github.com/nredd/pytest-airflow-in-a-box"

[project.entry-points.pytest11]
pytest_airflow_in_a_box = "pytest_airflow_in_a_box.plugin"

[dependency-groups]
dev = [
    "build==1.5.0",
    "prek==0.4.12",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "ty==0.0.69",
    "uv==0.12.2",
    "uv-build==0.12.2",
]

[tool.ruff]
required-version = "==0.16.1"
target-version = "py310"
line-length = 99
unsafe-fixes = true

[tool.ruff.analyze]
detect-string-imports = true

[tool.ruff.lint]
select = [
    "AIR",
    "ARG",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "I",
    "PGH",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TID",
    "UP",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ty]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.environment]
python-version = "3.10"

[tool.coverage.run]
branch = true
source = ["pytest_airflow_in_a_box"]
# Subprocess pytester runs are measured through `coverage.process_startup`
# (COVERAGE_PROCESS_START + the .pth installed by scripts/install_coverage_pth.py),
# so every process writes its own suffixed data file and runs end with a combine.
parallel = true
relative_files = true
sigterm = true

[tool.coverage.paths]
source = [
    "src/pytest_airflow_in_a_box",
    "*/src/pytest_airflow_in_a_box",
    "*/site-packages/pytest_airflow_in_a_box",
]

[tool.coverage.report]
# Full bar restored 2026-08-07: subprocess measurement plus fake-libc/windll
# probes made every platform branch reachable on any single platform.
fail_under = 100
show_missing = true
skip_covered = true
