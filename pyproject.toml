[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[project]
name = "pytest-airflow-in-a-box"
version = "0.8.0"
description = "Pytest infrastructure for testing Apache Airflow DAGs without a live deployment"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["airflow", "dag", "pytest", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Apache Airflow",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "packaging>=22",
    "pytest>=8",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8",
    "sqlalchemy>=1.4.36,<3",
]

# Airflow is deliberately absent from the base dependencies (pytest-django pattern): the
# 2.x monolith and the 3.x core both install the `airflow` package, so a hard 3.x pin
# would silently corrupt any 2.x environment. See issue #25.
[project.optional-dependencies]
airflow3 = [
    "apache-airflow>=3.1,<4",
    "apache-airflow-providers-sqlite>=4.1,<5",
]
airflow2 = [
    # The floor is the oldest certified release (#139), not the oldest the plugin might
    # happen to import on. The explicit marker is the cap: Airflow 2.11's own
    # `Requires-Python` uses bare `!=3.13,!=3.14` exclusions that do not stop patch
    # releases like 3.13.2. Tighter per-release ceilings (2.7.3 and 2.8.4 cap at 3.11)
    # are enforced by the plugin's own runtime check, which names the exact release.
    "apache-airflow>=2.7,<3; python_version < '3.13'",
]
postgres = [
    "asyncpg>=0.29,<1",
    "psycopg2-binary>=2.9,<3",
    "testcontainers>=4.15,<5",
]

[project.urls]
Changelog = "https://github.com/nredd/pytest-airflow-in-a-box/blob/main/CHANGELOG.md"
Documentation = "https://nredd.github.io/pytest-airflow-in-a-box/"
Homepage = "https://github.com/nredd/pytest-airflow-in-a-box"
Issues = "https://github.com/nredd/pytest-airflow-in-a-box/issues"
Repository = "https://github.com/nredd/pytest-airflow-in-a-box"

[project.entry-points.pytest11]
pytest_airflow_in_a_box = "pytest_airflow_in_a_box.plugin"

[project.scripts]
airflow-migration-diff = "pytest_airflow_in_a_box.migration.cli:main"

[dependency-groups]
# The dev group carries the 3.x pins directly so `uv sync` / `uv run` keep a working
# Airflow without naming an extra; the mutually-exclusive `airflow2` extra stays
# lockable via the [tool.uv] conflicts below.
dev = [
    "apache-airflow>=3.1,<4",
    "apache-airflow-providers-sqlite>=4.1,<5",
    "build==1.5.0",
    "prek==0.4.13",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
    "ty==0.0.70",
    "uv==0.12.3",
    "uv-build==0.12.3",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]

[tool.uv]
# One universal lock cannot resolve both Airflow majors into a single environment.
conflicts = [
    [
        { extra = "airflow2" },
        { extra = "airflow3" },
    ],
    [
        { extra = "airflow2" },
        { group = "dev" },
    ],
]

[tool.ruff]
required-version = "==0.16.2"
target-version = "py310"
line-length = 99
unsafe-fixes = true

[tool.ruff.analyze]
detect-string-imports = true

[tool.ruff.lint]
select = [
    "AIR",
    "ARG",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "I",
    "PGH",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TID",
    "UP",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ty]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.environment]
python-version = "3.10"

[tool.coverage.run]
branch = true
source = ["pytest_airflow_in_a_box"]
# Subprocess pytester runs are measured through `coverage.process_startup`
# (COVERAGE_PROCESS_START + the .pth installed by scripts/install_coverage_pth.py),
# so every process writes its own suffixed data file and runs end with a combine.
parallel = true
relative_files = true
sigterm = true

[tool.coverage.paths]
source = [
    "src/pytest_airflow_in_a_box",
    "*/src/pytest_airflow_in_a_box",
    "*/site-packages/pytest_airflow_in_a_box",
]

[tool.coverage.report]
# Full bar restored 2026-08-07: subprocess measurement plus fake-libc/windll
# probes made every platform branch reachable on any single platform.
fail_under = 100
show_missing = true
skip_covered = true
