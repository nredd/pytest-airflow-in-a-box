site_name: pytest-airflow-in-a-box
site_description: Pytest infrastructure for testing Apache Airflow DAGs without a live deployment
site_url: https://nredd.github.io/pytest-airflow-in-a-box/
repo_url: https://github.com/nredd/pytest-airflow-in-a-box
repo_name: nredd/pytest-airflow-in-a-box
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Quickstart: quickstart.md

  - Testing your Dags:
      - Whose fail is it anyway?: guide/testing-scope.md
      - The Fidelity Ladder: guide/ladder.md
      - Deferred tasks: guide/deferrable-operators.md
      - Cookbook: guide/cookbook.md
      - REST API: guide/rest-api.md
      - Smoke Tests: guide/smoke-tests.md

  - Custom components:
      - Checking components: guide/custom-components.md
      - Timetables: guide/custom-timetables.md
      - Registration and packaging: guide/custom-components-wiring.md

  - CI and migration:
      - GitHub Actions and reports: guide/ci/github-action.md
      - Airflow 2->3 Migration: guide/migration.md

  - Plugin reference:
      - Dependencies and extras: reference/dependencies.md
      - Fixtures: reference/fixtures.md
      - Markers: reference/markers.md
      - INI options: reference/ini-options.md
      - Smoke catalog and corpus mechanics: reference/smoke.md
      - Migration artifacts: reference/migration.md
      - Airflow Doctor: reference/diagnostics.md

  - Under the hood:
      - Compatibility and certification: internals/compat-layer.md
      - Test Environments: internals/test-environments.md
      - Us vs Them: internals/tests-common-parity.md
      - Developing the plugin: development.md
