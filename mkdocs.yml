site_name: pytest-airflow-in-a-box
site_description: Pytest infrastructure for testing Apache Airflow DAGs without a live deployment
site_url: https://nredd.github.io/pytest-airflow-in-a-box/
repo_url: https://github.com/nredd/pytest-airflow-in-a-box
repo_name: nredd/pytest-airflow-in-a-box
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md

  - Why do we test?: why/index.md

  - What do we test?:
      - Whose fail is it anyway?: guide/testing-scope.md
      - The Fidelity Ladder:
          - guide/ladder.md
          - One operator, no database: guide/db-free-execution.md
          - Real DagRuns and real state: guide/task-execution.md
          - Deferred tasks and your own triggers: guide/deferrable-operators.md
          - Talking to a live Airflow API: guide/rest-api.md
      - Custom Airflow components:
          - check_component: guide/custom-components.md
          - Running them: guide/custom-components-wiring.md
          - Timetables: guide/custom-timetables.md
          - Entry points: guide/isolated-tests.md

  - Cookbook: guide/cookbook.md
  - GitHub Action: guide/ci/github-action.md

  - Plugin reference:
      - Fixtures: reference/fixtures.md
      - Markers: reference/markers.md
      - INI options: reference/ini-options.md
      - Reports: guide/reports.md
      - Smoke Tests: guide/smoke-tests.md
      - Airflow Doctor: reference/diagnostics.md
      - Airflow 2->3 Migration:
          - guide/migration/index.md
          - Migration-strict mode: guide/migration/strict.md
          - Diffing outcomes across the upgrade: guide/migration/outcome-diff.md
          - Driving both families in one run: guide/migration/orchestrator.md
          - Running both families in CI: guide/migration/orchestrator-in-ci.md
          - Pairing migration-strict with ruff's AIR rules: guide/migration/ruff-air-rules.md
          - Baseline artifact contract: guide/migration/baseline-artifact.md

  - Under the hood:
      - Certification: internals/certification.md
      - Compatibility: internals/compat-layer.md
      - pytest-xdist: internals/bootstrap-env-ownership.md
      - Secrets: internals/parse-time-secrets.md
      - Test Environments: internals/test-environments.md
      - Us vs Them: internals/tests-common-parity.md
      - Developing the plugin: development.md
