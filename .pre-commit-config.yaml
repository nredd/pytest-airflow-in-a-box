default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-ast
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-format
        name: Format Python with ruff
        entry: uv run ruff format
        language: system
        files: \.pyi?$
        types_or: [python, pyi]
      - id: ruff-check
        name: Lint Python with ruff
        entry: uv run ruff check --fix
        language: system
        files: \.pyi?$
        types_or: [python, pyi]
      - id: ty-check
        name: Type check with ty
        entry: uv run ty check
        language: system
        pass_filenames: false
      - id: uv-lock-check
        name: Check the uv lockfile
        entry: uv lock --check
        language: system
        pass_filenames: false
      - id: forbid-inline-waivers
        name: Reject inline static-analysis waivers
        entry: uv run python scripts/check_inline_waivers.py
        language: system
        files: \.pyi?$
        types_or: [python, pyi]
      - id: changelog-fragment-required
        name: Require a changelog.d fragment for src/tests changes
        entry: uv run towncrier check
        language: system
        pass_filenames: false
